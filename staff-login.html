
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login - FYXITERZ</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f7f7f7;font-family:Arial,sans-serif;
 display:flex;align-items:center;justify-content:center;
 min-height:100vh;padding:20px;color:#222
}
.box{
 background:white;width:100%;max-width:380px;
 padding:25px;border:1px solid #eee;border-radius:12px
}
h1{text-align:center;font-size:25px;margin:5px}
p{text-align:center;color:#777;font-size:13px}
input{
 width:100%;padding:13px;margin:9px 0;
 border:1px solid #ddd;border-radius:7px;font-size:14px
}
button{
 width:100%;padding:13px;background:#222;color:white;
 border:0;border-radius:7px;font-size:14px;margin-top:10px
}
button:disabled{opacity:.6}
#message{
 text-align:center;font-size:13px;
 line-height:1.5;margin-top:12px;overflow-wrap:anywhere
}
a{
 display:block;text-align:center;margin-top:18px;
 color:#555;font-size:13px
}
</style>
</head>

<body>
<div class="box">
<h1>FYXITERZ</h1>
<p>Staff Login — Owner, Admin & Reseller</p>

<input id="email" type="email" placeholder="Email" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">

<button id="loginButton" onclick="login()">LOG MASUK</button>

<div id="message"></div>
<a href="index.html">Kembali ke Kedai</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://upkyhuxacuycscywfsrh.supabase.co";

const SUPABASE_KEY = "sb_publishable_hOLvnNVnra7QbnC2xJdopg_6h4ODRR5";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

async function login(){

 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;
 const message = document.getElementById("message");
 const button = document.getElementById("loginButton");

 if(!email || !password){
  message.textContent = "Sila masukkan email dan password.";
  return;
 }

 button.disabled = true;
 message.textContent = "Sedang menyemak akaun...";

 try {

  // LOGIN SUPABASE
  const {data,error} = await db.auth.signInWithPassword({
   email: email,
   password: password
  });

  if(error){
   message.textContent = "Login gagal: " + error.message;
   button.disabled = false;
   return;
  }

  // SEMAK PROFIL
  const {data:profile,error:profileError} = await db
   .from("profiles")
   .select("id,role")
   .eq("id",data.user.id)
   .maybeSingle();

  if(profileError){
   message.textContent = "Gagal membaca profil: " + profileError.message;
   await db.auth.signOut();
   button.disabled = false;
   return;
  }

  if(!profile){
   message.textContent = "Profil akaun tidak dijumpai.";
   await db.auth.signOut();
   button.disabled = false;
   return;
  }

  // SEMAK ROLE
  const role = String(profile.role || "").trim().toLowerCase();

  if(!["owner","admin","reseller"].includes(role)){
   message.textContent = "Role yang dibaca: " + role +
    ". Akaun ini bukan akaun staff.";
   await db.auth.signOut();
   button.disabled = false;
   return;
  }

  // REDIRECT OWNER
  if(role === "owner"){
   message.textContent = "Login berjaya. Membuka Owner Panel...";
   window.location.href = "owner.html";
   return;
  }

  // ADMIN / RESELLER
  message.textContent = "Login berjaya. Role: " + role +
   ". Panel staff belum dibina.";

  button.disabled = false;

 } catch(error){

  message.textContent = "Ralat sistem: " + error.message;
  button.disabled = false;

 }
}
</script>
</body>
</html>
