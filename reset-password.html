
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password - FYXITERZ</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f7f7f7;font-family:Arial,sans-serif;
 min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;color:#222
}
.box{
 background:white;padding:25px;border:1px solid #eee;
 border-radius:12px;width:100%;max-width:380px
}
h2{text-align:center}
p{text-align:center;color:#777;font-size:13px}
input{
 width:100%;padding:13px;margin:9px 0;
 border:1px solid #ddd;border-radius:7px
}
button{
 width:100%;padding:13px;background:#222;color:white;
 border:0;border-radius:7px;margin-top:10px
}
#message{line-height:1.5}
</style>
</head>
<body>
<div class="box">
<h2>FYXITERZ</h2>
<p>Tetapkan password baharu</p>

<input id="password" type="password"
 placeholder="Password baharu" autocomplete="new-password">

<input id="confirm" type="password"
 placeholder="Ulang password" autocomplete="new-password">

<button id="save" onclick="changePassword()">SIMPAN PASSWORD</button>
<p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://upkyhuxacuycscywfsrh.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_hOLvnNVnra7QbnC2xJdopg_6h4ODRR5";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

async function changePassword(){
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirm").value;
 const message=document.getElementById("message");
 const button=document.getElementById("save");

 if(password.length<8){
  message.textContent="Password mestilah sekurang-kurangnya 8 aksara.";
  return;
 }

 if(password!==confirm){
  message.textContent="Password tidak sama.";
  return;
 }

 button.disabled=true;
 message.textContent="Sedang mengemas kini...";

 const {data,error}=await db.auth.updateUser({
  password:password
 });

 if(error){
  message.textContent="Gagal: "+error.message;
  button.disabled=false;
  return;
 }

 message.textContent="Password berjaya ditukar. Sila log masuk semula.";
 button.disabled=false;
}
</script>
</body>
</html>
